name: Playwright on Azure
on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel workers'
        default: '5'
      grep:
        description: 'Only run tests whose title matches (regex). Blank = all'
        default: ''

permissions:
  contents: read

jobs:
  test-azure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Playwright tests on Azure
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
          WORKERS: ${{ inputs.workers }}
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --config=playwright.service.config.js --workers="$WORKERS" --grep "$GREP" --grep-invert "@cart"
          else
            npx playwright test --config=playwright.service.config.js --workers="$WORKERS" --grep-invert "@cart"
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-azure
          path: playwright-report/
          retention-days: 14